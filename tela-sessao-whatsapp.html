<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sessão WhatsApp</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  :root {
    --bg-page: #F4F3EF;
    --surface: #FFFFFF;
    --surface-muted: #EFEEE8;
    --border: #E3E1D9;
    --text-primary: #1F1E1B;
    --text-secondary: #6B6A63;
    --text-muted: #9B9A92;
    --accent: #0F6E56;
    --accent-bg: #E1F5EE;
    --warn: #854F0B;
    --warn-bg: #FAEEDA;
    --danger: #A32D2D;
    --danger-bg: #FCEBEB;
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg-page);
    color: var(--text-primary);
    padding: 2rem;
  }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }

  h1 { font-size: 18px; font-weight: 600; margin: 0 0 1rem; }

  .status-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .status-left { display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .dot.offline { background: var(--danger); }
  .status-title { font-weight: 600; font-size: 15px; margin: 0; }
  .status-sub { font-size: 13px; color: var(--text-secondary); margin: 2px 0 0; }
  .btn {
    font-size: 13px;
    padding: 6px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-primary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background: var(--surface-muted); }

  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .metric { background: var(--surface-muted); border-radius: var(--radius); padding: 1rem; }
  .metric-label { font-size: 13px; color: var(--text-secondary); margin: 0 0 4px; }
  .metric-value { font-size: 24px; font-weight: 600; margin: 0; }
  .metric-value.danger { color: var(--danger); }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .panel-head {
    padding: 0.75rem 1.25rem;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .filters { display: flex; gap: 6px; }
  .filter-btn {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
  }
  .filter-btn.active { background: var(--text-primary); color: #fff; border-color: var(--text-primary); }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0.75rem 1.25rem;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent-bg); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 13px; flex-shrink: 0;
  }
  .row-main { flex: 1; min-width: 0; }
  .row-top { display: flex; justify-content: space-between; gap: 8px; }
  .row-name { font-weight: 600; font-size: 14px; margin: 0; }
  .row-time { font-size: 12px; color: var(--text-muted); flex-shrink: 0; }
  .row-msg {
    font-size: 13px; color: var(--text-secondary); margin: 2px 0 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .badge {
    font-size: 12px; padding: 3px 10px; border-radius: var(--radius);
    flex-shrink: 0; font-weight: 500;
  }
  .badge.ok { background: var(--accent-bg); color: var(--accent); }
  .badge.pending { background: var(--warn-bg); color: var(--warn); cursor: pointer; }
  .badge.fail { background: var(--danger-bg); color: var(--danger); }

  .empty { padding: 2rem; text-align: center; color: var(--text-muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">

  <h1>Sessão WhatsApp</h1>

  <div class="status-card">
    <div class="status-left">
      <span class="dot" id="statusDot"></span>
      <div>
        <p class="status-title" id="statusTitle">Sessão conectada</p>
        <p class="status-sub" id="statusSub">+55 71 99999-8888 · ativa há 2h 14min</p>
      </div>
    </div>
    <button class="btn" onclick="toggleConnection()"><i class="ti ti-refresh"></i>Reconectar</button>
  </div>

  <div class="metrics">
    <div class="metric">
      <p class="metric-label">Contatos quentes</p>
      <p class="metric-value">18</p>
    </div>
    <div class="metric">
      <p class="metric-label">Não vinculados</p>
      <p class="metric-value">3</p>
    </div>
    <div class="metric">
      <p class="metric-label">Falhas (24h)</p>
      <p class="metric-value danger">1</p>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <span>Mensagens recebidas</span>
      <div class="filters">
        <button class="filter-btn active" data-filter="todos">Todos</button>
        <button class="filter-btn" data-filter="pending">Vincular</button>
        <button class="filter-btn" data-filter="fail">Falhas</button>
      </div>
    </div>
    <div id="rows"></div>
    <div class="empty" id="emptyState" style="display:none;">Nenhuma mensagem nessa categoria.</div>
  </div>

</div>

<script>
const mensagens = [
  { iniciais: 'MS', nome: 'Marina Santos', texto: "Oi, pode me avisar quando a tarefa for aprovada?", tempo: 'há 8 min', status: 'ok' },
  { iniciais: 'JP', nome: '+55 71 98888-2211', texto: 'Bom dia, gostaria de saber sobre o status', tempo: 'há 41 min', status: 'pending' },
  { iniciais: 'RC', nome: 'Rafael Costa', texto: 'Recebido, obrigado!', tempo: 'ontem', status: 'fail' },
];

const badgeConfig = {
  ok: { classe: 'ok', texto: 'Vinculado' },
  pending: { classe: 'pending', texto: 'Vincular' },
  fail: { classe: 'fail', texto: 'Falhou (463)' },
};

function render(filtro) {
  const rowsEl = document.getElementById('rows');
  const emptyEl = document.getElementById('emptyState');
  const lista = filtro === 'todos' ? mensagens : mensagens.filter(m => m.status === filtro);

  rowsEl.innerHTML = '';
  emptyEl.style.display = lista.length ? 'none' : 'block';

  lista.forEach(m => {
    const badge = badgeConfig[m.status];
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="avatar">${m.iniciais}</div>
      <div class="row-main">
        <div class="row-top">
          <p class="row-name">${m.nome}</p>
          <span class="row-time">${m.tempo}</span>
        </div>
        <p class="row-msg">${m.texto}</p>
      </div>
      <span class="badge ${badge.classe}">${badge.texto}</span>
    `;
    rowsEl.appendChild(row);
  });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.filter);
  });
});

let conectado = true;
function toggleConnection() {
  conectado = !conectado;
  document.getElementById('statusDot').classList.toggle('offline', !conectado);
  document.getElementById('statusTitle').textContent = conectado ? 'Sessão conectada' : 'Sessão desconectada';
  document.getElementById('statusSub').textContent = conectado ? '+55 71 99999-8888 · ativa há 2h 14min' : 'Tentando reconectar…';
}

render('todos');
</script>
</body>
</html>
