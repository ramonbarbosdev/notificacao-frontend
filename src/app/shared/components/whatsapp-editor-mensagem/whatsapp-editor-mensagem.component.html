@if (estiloCompose()) {
  <div class="mb-2">
    @for (variavel of variaveisRapidas; track variavel) {
      <button type="button" class="ui-var-chip" (click)="inserirVariavel(variavel)">
        ＋ {{ variavel }}
      </button>
    }
  </div>
  <div class="flex flex-wrap items-center gap-1 mb-2">
    <button
      type="button"
      (click)="aplicarFormato('negrito')"
      class="p-1.5 rounded-lg border border-[var(--color-border-soft)] text-[var(--color-text-muted)] hover:bg-[var(--color-surface-muted)]"
      title="Negrito (*texto*)"
    >
      <lucide-icon [img]="boldIcon" class="w-3.5 h-3.5" />
    </button>
    <button
      type="button"
      (click)="aplicarFormato('italico')"
      class="p-1.5 rounded-lg border border-[var(--color-border-soft)] text-[var(--color-text-muted)] hover:bg-[var(--color-surface-muted)]"
      title="Italico (_texto_)"
    >
      <lucide-icon [img]="italicIcon" class="w-3.5 h-3.5" />
    </button>
    <button
      type="button"
      (click)="aplicarFormato('riscado')"
      class="p-1.5 rounded-lg border border-[var(--color-border-soft)] text-[var(--color-text-muted)] hover:bg-[var(--color-surface-muted)]"
      title="Riscado (~texto~)"
    >
      <lucide-icon [img]="strikeIcon" class="w-3.5 h-3.5" />
    </button>
    <button
      type="button"
      (click)="aplicarFormato('monoespaco')"
      class="p-1.5 rounded-lg border border-[var(--color-border-soft)] text-[var(--color-text-muted)] hover:bg-[var(--color-surface-muted)]"
      title="Monoespaco (```texto```)"
    >
      <lucide-icon [img]="codeIcon" class="w-3.5 h-3.5" />
    </button>
  </div>
  <textarea
    #textarea
    [formControl]="control()"
    [rows]="rows()"
    [placeholder]="placeholder()"
    class="ui-compose-textarea"
  ></textarea>
  <div class="ui-preview-label">{{ labelPreview() }}</div>
  <div class="ui-bubble-wrap">
    <div class="ui-bubble">
      <div class="text-sm whitespace-pre-wrap break-words" [innerHTML]="previewHtml()"></div>
      <div class="ui-bubble-time">agora</div>
    </div>
  </div>
} @else {
  <div class="space-y-2">
    <div class="flex flex-wrap items-center gap-1">
      <button
        type="button"
        (click)="aplicarFormato('negrito')"
        class="p-1.5 rounded-lg border border-[var(--color-border)] text-[var(--color-text-muted)] hover:bg-[var(--color-surface-muted)]"
        title="Negrito (*texto*)"
      >
        <lucide-icon [img]="boldIcon" class="w-3.5 h-3.5" />
      </button>
      <button
        type="button"
        (click)="aplicarFormato('italico')"
        class="p-1.5 rounded-lg border border-[var(--color-border)] text-[var(--color-text-muted)] hover:bg-[var(--color-surface-muted)]"
        title="Italico (_texto_)"
      >
        <lucide-icon [img]="italicIcon" class="w-3.5 h-3.5" />
      </button>
      <button
        type="button"
        (click)="aplicarFormato('riscado')"
        class="p-1.5 rounded-lg border border-[var(--color-border)] text-[var(--color-text-muted)] hover:bg-[var(--color-surface-muted)]"
        title="Riscado (~texto~)"
      >
        <lucide-icon [img]="strikeIcon" class="w-3.5 h-3.5" />
      </button>
      <button
        type="button"
        (click)="aplicarFormato('monoespaco')"
        class="p-1.5 rounded-lg border border-[var(--color-border)] text-[var(--color-text-muted)] hover:bg-[var(--color-surface-muted)]"
        title="Monoespaco (```texto```)"
      >
        <lucide-icon [img]="codeIcon" class="w-3.5 h-3.5" />
      </button>
      @if (exibirPreview()) {
        <button
          type="button"
          (click)="alternarPreview()"
          class="ml-auto text-xs px-2 py-1 rounded-lg border border-[var(--color-border)] text-[var(--color-text-muted)] hover:bg-[var(--color-surface-muted)]"
        >
          {{ mostrarPreview() ? 'Ocultar preview' : 'Preview' }}
        </button>
      }
    </div>

    <textarea
      #textarea
      [formControl]="control()"
      [rows]="rows()"
      [placeholder]="placeholder()"
      class="w-full bg-[var(--color-surface-muted)] border border-[var(--color-border-soft)] rounded-xl px-3 py-2 text-sm text-[var(--color-text)] placeholder:text-[var(--color-text-subtle)] resize-y min-h-[6rem] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]"
    ></textarea>

    @if (exibirPreview() && mostrarPreview()) {
      <div class="ui-bubble-wrap">
        <div class="ui-bubble">
          <div class="text-sm whitespace-pre-wrap break-words" [innerHTML]="previewHtml()"></div>
        </div>
      </div>
    }
  </div>
}
