@if (commandDialog.dialog(); as dialog) {
  <div
    class="fixed inset-0 z-[200] flex items-center justify-center p-4"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'command-dialog-title'"
  >
    <button
      type="button"
      class="absolute inset-0 bg-black/60 backdrop-blur-[2px]"
      aria-label="Fechar"
      (click)="cancelar()"
    ></button>

    <div
      class="relative w-full max-w-md rounded-2xl border border-[var(--color-border)] bg-[var(--color-surface)] shadow-2xl"
    >
      <div class="px-6 pt-6 pb-4">
        <div class="flex items-start gap-3">
          <div
            class="mt-0.5 flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border"
            [class.border-[var(--color-danger-border)]]="dialog.variant === 'danger'"
            [class.bg-[var(--color-danger-bg)]]="dialog.variant === 'danger'"
            [class.text-[var(--color-danger)]]="dialog.variant === 'danger'"
            [class.border-[var(--color-border)]]="dialog.variant !== 'danger'"
            [class.bg-[var(--color-surface-muted)]]="dialog.variant !== 'danger'"
            [class.text-[var(--color-primary-soft)]]="dialog.variant !== 'danger'"
          >
            <lucide-icon [img]="alertIcon" class="h-5 w-5" />
          </div>

          <div class="min-w-0 flex-1">
            <h2
              id="command-dialog-title"
              class="text-base font-semibold text-[var(--color-text)]"
            >
              {{ dialog.title }}
            </h2>
            <p class="mt-2 whitespace-pre-line text-sm text-[var(--color-text-muted)]">
              {{ dialog.message }}
            </p>
          </div>
        </div>
      </div>

      <div class="flex flex-col-reverse gap-2 border-t border-[var(--color-border)] px-6 py-4 sm:flex-row sm:justify-end">
        <button
          type="button"
          class="inline-flex items-center justify-center rounded-xl border border-[var(--color-border)] px-4 py-2.5 text-sm font-semibold text-[var(--color-text)] hover:bg-[var(--color-surface-muted)]"
          (click)="cancelar()"
        >
          {{ dialog.cancelLabel }}
        </button>

        <button
          type="button"
          class="inline-flex items-center justify-center rounded-xl px-4 py-2.5 text-sm font-semibold"
          [class.bg-[var(--color-danger)]]="dialog.variant === 'danger'"
          [class.text-white]="dialog.variant === 'danger'"
          [class.hover:brightness-110]="dialog.variant === 'danger'"
          [class.bg-[var(--color-primary)]]="dialog.variant !== 'danger'"
          [class.text-[var(--color-bg-base)]]="dialog.variant !== 'danger'"
          [class.hover:brightness-110]="dialog.variant !== 'danger'"
          (click)="confirmar()"
        >
          {{ dialog.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
