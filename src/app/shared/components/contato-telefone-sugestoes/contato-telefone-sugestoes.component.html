<div class="relative">
  <input
    type="tel"
    inputmode="tel"
    [formControl]="control()"
    [placeholder]="placeholder()"
    (input)="onInput($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
    class="w-full border border-[var(--color-border-strong)] rounded-xl text-[var(--color-text)] placeholder:text-[var(--color-text-subtle)] text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] focus:border-transparent transition-all duration-200"
    [class.bg-[var(--color-surface-muted)]]="!compacto()"
    [class.bg-[var(--color-bg-base)]]="compacto()"
    [class.px-4]="!compacto()"
    [class.py-3]="!compacto()"
    [class.px-3]="compacto()"
    [class.py-2]="compacto()"
  />

  @if (aberto()) {
    <ul
      class="absolute z-30 mt-1 w-full max-h-56 overflow-y-auto rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] shadow-lg"
    >
      @if (carregando() && sugestoes().length === 0) {
        <li class="px-3 py-2 text-xs text-[var(--color-text-muted)]">Buscando no historico...</li>
      }

      @for (item of sugestoes(); track item.idNotificacao) {
        <li>
          <button
            type="button"
            (mousedown)="selecionar(item); $event.preventDefault()"
            class="w-full text-left px-3 py-2.5 hover:bg-[var(--color-surface-muted)] transition-colors border-b border-[var(--color-border)] last:border-b-0"
          >
            <div class="flex items-center justify-between gap-2">
              <span class="text-sm font-mono text-[var(--color-text)]">
                {{ formatarTelefone(item.destinatario) }}
              </span>
              <span class="text-[10px] px-1.5 py-0.5 rounded border border-[var(--color-border)] text-[var(--color-text-muted)] shrink-0">
                {{ item.status }}
              </span>
            </div>
          </button>
        </li>
      }
    </ul>
  }
</div>
