<div class="mb-4 flex flex-wrap items-center gap-3">
  <a routerLink="/app/integracoes/github/modulos" class="text-sm text-[var(--color-text-faint)] hover:text-[var(--color-text)] no-underline">
    ‹ Módulos
  </a>
  <span class="text-sm text-[var(--color-text-muted)]">Project v2 (kanban)</span>
</div>

@if (!moduloHabilitado()) {
  <div class="mb-4 rounded-xl border border-[var(--color-warning)]/40 bg-[var(--color-warning-bg)] px-4 py-3 text-sm text-[var(--color-warning)]">
    Módulo desativado — eventos <code class="font-mono text-xs">projects_v2_item</code> não serão processados até você ativar em Módulos.
  </div>
}

@if (carregando()) {
  <div class="flex items-center justify-center gap-3 py-16 text-[var(--color-text-muted)]">
    <lucide-icon [img]="loaderIcon" class="w-5 h-5 animate-spin" />
    Carregando…
  </div>
} @else {
  @if (erro()) {
    <div class="mb-6 bg-[var(--color-danger-bg)] border border-[var(--color-danger-border)] rounded-xl px-4 py-3">
      <p class="text-[var(--color-danger)] text-sm m-0">{{ erro() }}</p>
    </div>
  }

  <form [formGroup]="form" class="space-y-6" (ngSubmit)="salvar()">
    <app-configuracoes-github-tab
      escopo="modulo"
      [exibirCabecalhoIntegracao]="false"
      [secaoAtiva]="secao()"
      (secaoChange)="navegarSecao($event)"
      [form]="form"
      [errosFormulario]="errosFormulario()"
      [graphqlTokenConfigurado]="graphqlTokenConfigurado()"
      [githubAppPrivateKeyConfigurado]="githubAppPrivateKeyConfigurado()"
      [templatesPorCenarioServidor]="githubTemplatesPorCenario()"
      (templatesPorCenarioChange)="onTemplatesPorCenarioChange($event)"
      (salvarSolicitado)="salvar()"
    />

    <div class="flex justify-end">
      <button
        type="button"
        class="ui-btn ui-btn-primary !flex-none"
        [disabled]="salvando() || !form.dirty"
        (click)="salvar()"
      >
        @if (salvando()) {
          <lucide-icon [img]="loaderIcon" class="w-4 h-4 animate-spin" />
        }
        Salvar módulo Project v2
      </button>
    </div>
  </form>
}
