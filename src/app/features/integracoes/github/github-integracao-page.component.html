<div class="mb-6">
  <h1 class="text-2xl font-bold text-[var(--color-text)]">Integração GitHub</h1>
  <p class="text-[var(--color-text-muted)] text-sm mt-1">
    Conexão, equipe, kanban Project v2, regras e templates WhatsApp.
  </p>
  @if (!featureHabilitada()) {
    <p class="mt-2 text-sm text-amber-600">
      O recurso GitHub Webhook não está habilitado no plano desta organização.
    </p>
  }
</div>

@if (carregando()) {
  <div class="flex items-center justify-center gap-3 py-16 text-[var(--color-text-muted)]">
    <lucide-icon [img]="loaderIcon" class="w-5 h-5 animate-spin" />
    Carregando...
  </div>
} @else {
  @if (erro()) {
    <div class="mb-6 bg-[var(--color-danger-bg)] border border-[var(--color-danger-border)] rounded-xl px-4 py-3">
      <p class="text-[var(--color-danger)] text-sm">{{ erro() }}</p>
    </div>
  }

  <form [formGroup]="form" class="space-y-6">
    <app-configuracoes-github-tab
      [form]="form"
      [errosFormulario]="errosFormulario()"
      [graphqlTokenConfigurado]="graphqlTokenConfigurado()"
      [githubAppPrivateKeyConfigurado]="githubAppPrivateKeyConfigurado()"
      [templatesPorCenarioServidor]="githubTemplatesPorCenario()"
      (templatesPorCenarioChange)="onTemplatesPorCenarioChange($event)"
      (salvarSolicitado)="salvar()"
    />

    <div
      class="flex justify-end gap-3 pt-4"
      [class.sticky]="form.dirty"
      [class.bottom-0]="form.dirty"
      [class.z-10]="form.dirty"
      [class.-mx-2]="form.dirty"
      [class.px-2]="form.dirty"
      [class.pb-2]="form.dirty"
      [class.bg-[var(--color-bg-base)]]="form.dirty"
      [class.border-t]="form.dirty"
      [class.border-[var(--color-border)]]="form.dirty"
    >
      <button
        type="button"
        class="btn-primary-admin"
        [disabled]="salvando() || !form.dirty"
        (click)="salvar()"
      >
        @if (salvando()) {
          <lucide-icon [img]="loaderIcon" class="w-4 h-4 animate-spin inline" />
        }
        Salvar integração GitHub
      </button>
    </div>
  </form>
}
